name: Set up PlatformIO
description: Python, PlatformIO (pioarduino), the package cache and the platform penv pin.
inputs:
  env:
    description: PlatformIO environment the job builds
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        enable-cache: false
    - name: Install PlatformIO Core
      shell: bash
      run: |
        uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
        # platform-espressif32's builder imports these unconditionally.
        uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
          "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
          "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
          "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"
    - uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: pio-v3-${{ runner.os }}-${{ inputs.env }}-${{ hashFiles('platformio.ini') }}
        restore-keys: pio-v3-${{ runner.os }}-${{ inputs.env }}-
    - name: Pin pioarduino core inside the platform penv
      shell: bash
      run: |
        set -euo pipefail
        # Envs with custom_sdkconfig run a nested `pio run` from ~/.platformio/penv, which the
        # platform bootstraps with an open-ended "pioarduino>=6.1.19" (now 6.2.0). That core
        # wants tool-scons 4.11.1 while platform 55.03.311 pins 4.8.1; they reinstall over
        # each other and the running SCons loses its package mid-build ("No module named
        # 'SCons.Tool.FortranCommon'"). Keep the penv core on the outer core's version.
        # https://github.com/pioarduino/platform-espressif32/issues/529
        pio pkg install -e ${{ inputs.env }}
        uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
        ~/.platformio/penv/bin/pio --version

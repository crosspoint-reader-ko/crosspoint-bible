name: Release

# Push a tag like v0.1.0. The version in platformio.ini ([crosspoint] version) must match.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Check version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's/^version = //p' platformio.ini | head -1)
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME but platformio.ini has $have"; exit 1; }
      - uses: ./.github/actions/setup-pio
        with:
          env: gh_release
      - name: Build
        run: pio run -e gh_release -j1
      - name: Collect assets
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp .pio/build/gh_release/firmware.bin "dist/crosspoint-bible-$v-x4-x3.bin"
          cp data/bible/krv1961.cpb dist/krv1961.cpb
          cp tools/bible/epub2cpb.py dist/epub2cpb.py
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body_path: .github/release-notes.md

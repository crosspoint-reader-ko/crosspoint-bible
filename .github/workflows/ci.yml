name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Pack converter tests
        run: python3 tools/bible/test_epub2cpb.py
      - name: Host tests
        run: |
          cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test -j"$(nproc)"
          BIBLE_CPB="$PWD/data/bible/krv1961.cpb" ctest --test-dir build/test --output-on-failure -j"$(nproc)"

  build:
    name: Build X4/X3 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-pio
        with:
          env: default
      # No EPUB here, so the build embeds data/bible/krv1961.cpb (개역한글, public domain).
      - run: pio run -e default -j1
      - uses: actions/upload-artifact@v6
        with:
          name: firmware
          path: .pio/build/default/firmware.bin
